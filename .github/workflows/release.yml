# Builds christbashtree for the Asciiverse catalog: one archive per target,
# christbashtree-<target>.tar.gz (.zip for Windows), plus SHA256SUMS,
# attached to a GitHub release (hub/catalog/SCHEMA.md, release.source =
# "github"). Runs on a pushed tag of ours (v<date of upstream's last
# commit>-av.<n>), or by hand for an existing tag.
#
# One C99 file and the C library: Linux builds run in Alpine and link
# statically (the -musl triple av looks for first), macOS uses the system
# compiler, Windows is cross-built with MinGW and draws through the
# console's VT mode (Windows 10 1809 and later).

name: release

on:
  push:
    tags: ["*-av.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build and package
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.22 sh -c '
            apk add --no-cache build-base &&
            LDFLAGS="-static -s" asciiverse/build.sh &&
            asciiverse/package.sh ${{ matrix.target }}'
          file out/christbashtree

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-apple-darwin, arch: x86_64 }
          - { target: aarch64-apple-darwin, arch: arm64 }
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build and package
        run: |
          CFLAGS="-O2 -arch ${{ matrix.arch }}" LDFLAGS="-arch ${{ matrix.arch }}" asciiverse/build.sh
          strip out/christbashtree
          file out/christbashtree
          asciiverse/package.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  windows:
    runs-on: ubuntu-24.04
    env:
      TARGET: x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build and package
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64 zip
          CC=x86_64-w64-mingw32-gcc LDFLAGS="-static -s" EXE=.exe asciiverse/build.sh
          file out/christbashtree.exe
          asciiverse/package.sh $TARGET

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  release:
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "christbashtree $TAG" \
                 --notes "Sergio Lepore's ChristBASHTree (github.com/sergiolepore/ChristBASHTree) ported to C for the Asciiverse catalog: one binary for Linux, macOS and Windows. Public domain (the Unlicense). Changes: see PATCHES.md."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
